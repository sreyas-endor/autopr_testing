<svg xmlns="http://www.w3.org/2000/svg" viewBox="266 24 220 256" width="220" role="img" aria-label="Darth Reviewer">
  <style>
    /* The source art is two CSS transform loops. Keeping them as real CSS is why this is a
       few KB and runs at the browser's frame rate: the same motion as a GIF was 164 KB at
       10 fps and visibly choppy. The sweep is tightened from the source art's 150px/50deg to
       70px/35deg so the blade stays inside the figure's own bounds and the icon needs no
       extra padding. Each animated group is wrapped so its transform origin
       sits at 0 0, so no transform-origin or transform-box is needed, which is what makes
       it render identically in Chrome, Firefox and Safari. */
    .saber { animation: saber 3s ease-in-out infinite; }
    .grip  { animation: grip 1.5s linear infinite; }
    @keyframes saber {
      0%, 100% { transform: translateX(0) rotate(-25deg); }
      50%      { transform: translateX(70px) rotate(10deg); }
    }
    @keyframes grip { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .saber, .grip { animation: none; } }
  </style>
